name: ts-workspace
services:
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: ts-workspace-garage
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${STORAGE_LOCAL_RPC_SECRET:?Configure STORAGE_LOCAL_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Configure STORAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${STORAGE_SECRET_KEY:?Configure STORAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${STORAGE_BUCKET:-ts-workspace-dev}
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks: [java-network]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  mysql-java:
    image: mysql:8.4.11
    container_name: ts-workspace-mysql-java
    environment:
      MYSQL_DATABASE: ts_workspace_java
      MYSQL_USER: ts_workspace_java
      MYSQL_PASSWORD: ${JAVA_MYSQL_PASSWORD:?Configure JAVA_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${JAVA_MYSQL_ROOT_PASSWORD:?Configure JAVA_MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - mysql-java-data:/var/lib/mysql
    networks: [java-network]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u ts_workspace_java -D ts_workspace_java -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  mysql:
    profiles: [legacy]
    image: mysql:8.4.11
    container_name: ts-workspace-mysql
    environment:
      MYSQL_DATABASE: ts_workspace
      MYSQL_USER: ts_workspace
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-LEGACY_SERVICE_DISABLED}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-LEGACY_SERVICE_DISABLED}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-shadow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u ts_workspace -D ts_workspace -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  mysql-test:
    image: mysql:8.4.11
    container_name: ts-workspace-mysql-test
    profiles: [legacy-test]
    environment:
      MYSQL_DATABASE: ts_workspace_test
      MYSQL_USER: ts_workspace_test
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:-LEGACY_SERVICE_DISABLED}
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:-LEGACY_SERVICE_DISABLED}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql-test-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u ts_workspace_test -D ts_workspace_test -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  garage-meta:
    name: ts_workspace_garage_meta
  garage-data:
    name: ts_workspace_garage_data
  mysql-java-data:
    name: ts_workspace_mysql_java_data
  mysql-data:
    name: ts-workspace-mysql-data
  mysql-test-data:
    name: ts-workspace-mysql-test-data
networks:
  java-network:
    name: ts-workspace-java-network
