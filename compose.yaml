name: ts-workspace
services:
  mysql:
    image: mysql:8.4.11
    container_name: ts-workspace-mysql
    environment:
      MYSQL_DATABASE: ts_workspace
      MYSQL_USER: ts_workspace
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-shadow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u ts_workspace -D ts_workspace -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  mysql-test:
    image: mysql:8.4.11
    container_name: ts-workspace-mysql-test
    profiles: [test]
    environment:
      MYSQL_DATABASE: ts_workspace_test
      MYSQL_USER: ts_workspace_test
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:?Configure MYSQL_TEST_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:?Configure MYSQL_TEST_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql-test-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u ts_workspace_test -D ts_workspace_test -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  mysql-data:
    name: ts-workspace-mysql-data
  mysql-test-data:
    name: ts-workspace-mysql-test-data
