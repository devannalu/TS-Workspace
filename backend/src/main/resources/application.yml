server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        name: TS_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /
spring:
  application:
    name: ts-workspace-java
  mail:
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1029}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.debug: false
  datasource:
    url: ${JAVA_DATABASE_URL:jdbc:mysql://127.0.0.1:3309/ts_workspace_java}
    username: ${JAVA_MYSQL_USER:ts_workspace_java}
    password: ${JAVA_MYSQL_PASSWORD}
    hikari:
      connection-timeout: 5000
      data-source-properties:
        connectionTimeZone: "+00:00"
        forceConnectionTimeZoneToSession: "true"
        preserveInstants: "true"
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 8h
app:
  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${EMAIL_FROM:workspace@example.test}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  bootstrap:
    enabled: ${JAVA_BOOTSTRAP_ENABLED:false}
    exit-on-complete: ${JAVA_BOOTSTRAP_EXIT:false}
