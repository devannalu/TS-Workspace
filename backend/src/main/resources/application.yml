server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        name: TS_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /
spring:
  application:
    name: ts-workspace-java
  datasource:
    url: ${JAVA_DATABASE_URL:jdbc:mysql://127.0.0.1:3309/ts_workspace_java}
    username: ${JAVA_MYSQL_USER:ts_workspace_java}
    password: ${JAVA_MYSQL_PASSWORD}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 8h
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  bootstrap:
    enabled: ${JAVA_BOOTSTRAP_ENABLED:false}
    exit-on-complete: ${JAVA_BOOTSTRAP_EXIT:false}
